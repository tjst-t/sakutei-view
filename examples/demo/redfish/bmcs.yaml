# --redfish-config for the sakutei-view demo (optional -- the base
# dnszone/nftables path works without it).
#
# Modeled on the real schema documented in Sakutei's own
# docs/providers/redfish.md (github.com/tjst-t/sakutei, tag v2.6.0), and
# exercised for real against the qemu-bmc node in
# examples/demo/topology.clab.yml once deployed: the real Sakutei v2.6.0
# binary used this file with `-redfish-config` to plan and reconcile
# redfish-system//server01 (Off -> On, boot override disabled) against the
# qemu-bmc's actual Redfish endpoint. See examples/demo/README.md.
#
# address below matches server01's mgmt-ipv4 in examples/demo/topology.clab.yml.
# qemu-bmc's Redfish endpoint uses a self-signed certificate, hence
# insecure_skip_verify (acceptable for this throwaway demo lab only --
# sakutei-view's own internal/httpclient never offers a TLS-verification-skip
# option; this is Sakutei's own, separate --redfish-config, for a demo BMC
# that has no real CA).
secret_store: secrets.json

bmcs:
  server01:
    address: https://172.30.30.11
    username: admin
    password: secretref:file/bmc/server01
    insecure_skip_verify: true
